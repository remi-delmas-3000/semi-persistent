name: Proof Replay
on:
  pull_request:
    paths:
      - 'proofs/checker/**'
      - 'egraph/**'
      - 'doc/book/examples/**'
      - '.github/workflows/checker.yml'
  push:
    branches: [main]
    paths:
      - 'proofs/checker/**'
      - 'egraph/**'
      - 'doc/book/examples/**'
      - '.github/workflows/checker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the Lean checker under proofs/checker (no dependency beyond the
  # Lean toolchain's own libraries), gates its two soundness theorems on the
  # three standard axioms, replays the stream fixtures, then has the engine
  # write the replay stream of every regression program that expects `ok` and
  # replays each one, the kernel checking the steps the replay emits
  # (proofs/checker/scripts/check-replay.py, which runs locally the same
  # way). The job fails on an engine failure under --proofs, a replay that
  # does not finish, a rejected node table, or a program proving fewer
  # check-eq through the kernel than proofs/checker/coverage.tsv records.
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o /tmp/elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build the checker and gate its axioms
        working-directory: proofs/checker
        run: |
          set -euo pipefail
          lake build 2>&1 | tee /tmp/lake.log
          if grep -q "declaration uses 'sorry'" /tmp/lake.log; then
            echo "a declaration uses sorry"; exit 1
          fi
          grep -q "'SemperCheck.goal_sound' depends on axioms: \[propext, Classical.choice, Quot.sound\]" /tmp/lake.log
          grep -q "'SemperCheck.Replay.replay_sound' depends on axioms: \[propext, Classical.choice, Quot.sound\]" /tmp/lake.log
          grep -q "'SemperCheck.Replay.replay_classes' depends on axioms: \[propext, Classical.choice, Quot.sound\]" /tmp/lake.log

      - name: Replay the stream fixtures
        run: python3 -B proofs/checker/scripts/test-replay.py

      - uses: ./.github/actions/setup-rust
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build the engine
        run: cargo build --release -p semi-persistent-egraph --bin semi-persistent

      - name: Write and replay the streams
        run: python3 -B proofs/checker/scripts/check-replay.py --jobs 4
